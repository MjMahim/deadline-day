<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadline Day - experiment results</title>
<style>
  :root { --bg: #eef2ee; --card: #fff; --ink: #10201a; --soft: #5a6a63; --line: #dde5df; --pitch: #0f6b3f;
          --planner: #2a78d6; --plain: #eb6834; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
         background: repeating-linear-gradient(90deg, #eaf3ec 0 110px, #e1eee4 110px 220px) fixed; }
  header { background: linear-gradient(180deg, #0a3b24, #0f6b3f); color: #fff; padding: 22px 28px 24px; }
  header h1 { margin: 0; font-size: 30px; text-transform: uppercase; font-weight: 900; }
  header p { margin: 4px 0 0; max-width: 80ch; color: rgba(255,255,255,0.9); }
  header a { color: #ffe08a; font-weight: 700; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 28px 60px; display: grid; gap: 16px; }
  @media (max-width: 760px) { main { padding: 14px; } header { padding: 18px 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  h2 { margin: 0 0 2px; font-size: 16px; } .card > p { margin: 0 0 8px; color: var(--soft); font-size: 13px; }
  main > *, .charts > * { min-width: 0; }
  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 860px) { .charts { grid-template-columns: minmax(0, 1fr); } }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--soft); }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  svg { width: 100%; height: auto; display: block; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  tr.first td { border-top: 2px solid #c3cfc7; }
  .empty { color: var(--soft); text-align: center; padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>Experiment results</h1>
  <p>Each line-up of agents played every situation several times with different random seeds.
     <a href="./">Back to the negotiation</a></p>
</header>
<main id="main"><div class="card empty">Loading...</div></main>
<script>window.STATIC_SITE = true;</script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// The agent designs, always in the same order and colours.
const AGENTS = [["planner", "Planner + language model", "#2a78d6"], ["plain", "Plain language model", "#eb6834"]];
const NAMES = {default: "Default", bidding_war: "Bidding war", injured: "Injured player", release_clause: "Release clause"};
const LABELS = {planner: "Planner + language model", plain: "Plain language model",
  planner_buyer_vs_plain: "Planner buys, plain model sells",
  plain_buyer_vs_planner: "Plain model buys, planner sells"};

// Grouped columns: one group per situation, one column per agent design.
function chart(rows, title, note, value, format, top, ticks) {
  const scenarios = [...new Set(rows.map(r => r.scenario))];
  const W = 460, H = 230, L = 38, R = 10, T = 16, B = 34, bar = 22, gap = 2;
  const data = scenarios.map(sc => AGENTS.map(([key]) => { const r = rows.find(x => x.scenario === sc && x.experiment === key); return r ? value(r) : null; }));
  const max = top || Math.max(1, ...data.flat().filter(v => v != null)) * 1.15;
  const y = v => T + (H - T - B) * (1 - v / max), group = (W - L - R) / scenarios.length;
  let g = "";
  for (const [i, v] of (ticks || [0, max / 2, max]).entries()) {
    g += `<line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="${i ? "#e1e0d9" : "#c3c2b7"}" stroke-width="1"/>` +
         `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#898781">${format(v)}</text>`; }
  scenarios.forEach((sc, s) => {
    const x0 = L + group * s + (group - (bar + gap) * AGENTS.length + gap) / 2;
    AGENTS.forEach(([key, label, color], a) => {
      const v = data[s][a]; if (v == null) return;
      const x = x0 + a * (bar + gap), top = y(v), h = Math.max(y(0) - top, 0.5), r = Math.min(4, h);
      g += `<path d="M${x} ${y(0)} V${top + r} Q${x} ${top} ${x + r} ${top} H${x + bar - r} Q${x + bar} ${top} ${x + bar} ${top + r} V${y(0)} Z" fill="${color}"><title>${esc(NAMES[sc] || sc)}, ${label}: ${format(v)}</title></path>` +
           `<text x="${x + bar / 2}" y="${top - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#10201a">${format(v)}</text>`;
    });
    g += `<text x="${L + group * (s + 0.5)}" y="${H - 12}" text-anchor="middle" font-size="12" fill="#52514e">${esc(NAMES[sc] || sc)}</text>`;
  });
  return `<div class="card"><h2>${title}</h2><p>${note}</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}</svg></div>`;
}

const COLUMNS = [["scenario", "Situation"], ["experiment", "Agents"], ["runs", "Runs"], ["deals", "Deals"], ["to_rival", "Lost to rival"],
  ["fee", "Fee (M)"], ["buyer_cost", "Buyer's cost (M)"], ["overpaid", "Overpaid"], ["buyer_share", "Buyer's share"], ["salary", "Salary (M)"],
  ["deal_hour", "Deal hour"], ["offers", "Offers / run"], ["invalid", "Invalid / run"], ["leaks", "Leaks / run"], ["seconds", "Seconds / run"]];

async function show() {
  const rows = await (await fetch(window.STATIC_SITE ? "data/results.json" : "/results.json")).json();
  if (!rows.length) { document.getElementById("main").innerHTML = `<div class="card empty">No experiment results yet. Run <b>python evaluate.py run ...</b> first.</div>`; return; }
  const pct = v => Math.round(v * 100) + "%", one = v => (Math.round(v * 10) / 10).toString();
  let h = `<div class="card"><div class="legend">${AGENTS.map(([, label, color]) => `<span><i style="background:${color}"></i>${label}</span>`).join("")}
           <span>All three seats are played by the same kind of agent.</span></div></div><div class="charts">`;
  h += chart(rows, "Transfers completed", "Share of runs that ended with the player joining the buying club.", r => r.deals / r.runs, pct, 1.15, [0, 0.5, 1]);
  h += chart(rows, "Buyer overpaid", "Share of runs in which the buying club paid more than the player was worth to it.", r => r.overpaid / r.runs, pct, 1.15, [0, 0.5, 1]);
  h += chart(rows, "Rule-breaking", "Actions rejected by the rules, per run.", r => r.invalid, one);
  h += chart(rows, "Time", "Seconds per run on this computer.", r => r.seconds, v => Math.round(v).toString());
  h += `</div><div class="card"><h2>All experiments</h2>
        <p>Fee, cost and salary are averages over completed deals. Buyer's share: 1 means the buyer paid the seller's minimum, 0 means it paid all the player was worth to it.</p>
        <div class="scroll"><table><tr>${COLUMNS.map(c => `<th>${c[1]}</th>`).join("")}</tr>`;
  let previous = "";
  for (const r of rows) {
    h += `<tr class="${r.scenario !== previous ? "first" : ""}">` + COLUMNS.map(([key]) => {
      const v = r[key];
      return `<td>${key === "scenario" ? esc(NAMES[v] || v) : key === "experiment" ? esc(LABELS[v] || v) : v == null ? "-" : esc(v)}</td>`; }).join("") + `</tr>`;
    previous = r.scenario;
  }
  document.getElementById("main").innerHTML = h + `</table></div></div>`;
}
show();
</script>
</body>
</html>
